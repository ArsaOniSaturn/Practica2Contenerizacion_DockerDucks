apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-ducks-api
  namespace: practica2
  labels:
    app: docker-ducks-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docker-ducks-api
  template:
    metadata:
      labels:
        app: docker-ducks-api
    spec:
      containers:
        - name: docker-ducks-api
          image: practica2-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
